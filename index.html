<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memorias - Los 15 de Uma</title>
    <meta property="og:title" content="Umi - Mis quince">
    <meta property="og:description"
        content="Compartí los recuerdos de la fiesta. Entrá acá para subir tus fotos y videos al álbum en vivo.">
    <meta property="og:image" content="assets/img/preview.jpg"> <!-- preview-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/img/preview.jpg"> <!-- favicon -->-->

    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <main class="main-layout">

        <section class="hero-section">
            <video class="hero-media" id="heroVideo" autoplay muted loop playsinline poster="assets/img/umi_10.jpg">
                <!-- TODO: agregar el video de la quinceañera cuando esté disponible -->
                <!-- <source src="assets/video/hero.mp4" type="video/mp4"> -->
            </video>
            <img class="hero-media" id="heroImageFallback" src="assets/img/umi_10.jpg" alt="">
            <div class="hero-overlay"></div>
            <div class="hero-text animate__animated animate__fadeIn">
                <h1>Umi - Mis quince</h1>
                <p>Álbum de la fiesta</p>
            </div>
        </section>

        <section class="controls-section animate__animated animate__slideInUp">

            <div class="sheet-handle"></div>

            <div class="controls-content">
                <div class="welcome-text">
                    <h2>¡Bienvenidos!</h2>
                    <p>Creemos juntos el álbum de la fiesta.</p>
                </div>

                <div class="buttons-grid">
                    <button class="btn-app btn-primary" id="btnCamera">
                        <i class="fa-solid fa-camera"></i>
                        <span>Sacar foto o video</span>
                    </button>

                    <button class="btn-app btn-secondary" id="btnGallery">
                        <i class="fa-solid fa-upload"></i>
                        <span>Subir de la galería</span>
                    </button>

                    <div class="divider"></div>

                    <a href="album/album.html" class="btn-app btn-outline">
                        <i class="fa-regular fa-images"></i>
                        <span>Ver el Álbum</span>
                    </a>
                </div>
            </div>
        </section>

    </main>

    <input type="file" id="inputCamera" class="hidden-input" accept="image/*,video/*" capture="environment">
    <input type="file" id="inputGallery" class="hidden-input" accept="image/*,video/*" multiple>

    <div id="preview-modal">
        <div class="modal-card animate__animated animate__zoomIn">
            <h3>¿Subimos esta?</h3>
            <div class="img-container">
                <img id="preview-img" src="" />
            </div>
            <div class="modal-actions">
                <button class="btn-app btn-outline" onclick="cerrarPreview()">No, otra</button>
                <button class="btn-app btn-primary" onclick="subirFotoDefinitiva()">Sí, subir</button>
            </div>
        </div>
    </div>

    <div id="loader-modal">
        <div class="ios-spinner"></div>
        <p class="loader-msg">Procesando...</p>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/ui-modal.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
